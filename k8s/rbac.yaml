apiVersion: v1
kind: ServiceAccount
metadata:
  name: go-yuga-dist-sa
  namespace: go-yuga-dist
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-watcher
  namespace: go-yuga-dist
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: go-yuga-dist-rb
  namespace: go-yuga-dist
subjects:
- kind: ServiceAccount
  name: go-yuga-dist-sa
roleRef:
  kind: Role
  name: job-watcher
  apiGroup: rbac.authorization.k8s.io
